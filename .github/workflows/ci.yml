name: CI

on:
  push:
    branches: [main]
  pull_request:

# アクションはタグではなくコミット SHA で固定する。タグは動かせるので、
# 上流が乗っ取られたときに CI へ任意のコードが入る。上げるときは SHA とコメントの両方を変える。
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler.jsonc と .dev.vars は git に入れない。ひな形をそのまま使う（ローカルで動く値になっている）
      - run: cp wrangler.example.jsonc wrangler.jsonc && cp .dev.vars.example .dev.vars

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # worker-configuration.d.ts は生成物をコミットしている。ひな形から作り直して差分が出たら、
      # vars / bindings のキーを変えたのに pnpm types を忘れている
      - name: worker-configuration.d.ts が最新か
        run: pnpm types && git diff --exit-code -- worker-configuration.d.ts

      - run: pnpm build
